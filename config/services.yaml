# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    openrouter.api_key: '%env(OPENROUTER_API_KEY)%'
    geonames_username: 'nourmontasser' # Add this to your .env file
    # Environment-based parameters
    app.ai_api_key: '%env(AI_API_KEY)%'
    app.ai_api_url: '%env(AI_API_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\AiAssistantService:
    App\Service\AIDescriptionGenerator:
        arguments:
            $deepseekApiKey: '%env(AI_API_KEY)%'
            $apiUrl: '%env(AI_API_URL)%' 
        # Register PriceEstimationSubscriber and inject the AIDescriptionGenerator
    App\EventSubscriber\PriceEstimationSubscriber:
        arguments:
            $aiDescriptionGenerator: '@App\Service\AIDescriptionGenerator'
        tags:
            - { name: 'kernel.event_subscriber' }
    App\Service\CurrencyConverter: ~

    # add more service definitions when explicit configuration is needed
    App\Service\LightcastTokenService: ~
    # please note that last definitions always *replace* previous ones
    App\Service\GeonamesService:
        arguments:
            $geonamesUsername: '%geonames_username%'

    App\Service\ApplicationMailer:
        autowire: true
        autoconfigure: true

    App\Service\AiCoverLetterGenerator:
            arguments:
                $huggingFaceToken: '%env(HUGGING_FACE_API_TOKEN)%'
                $modelName: '%env(HUGGING_FACE_MODEL)%'
    App\Service\DeepseekAIService:
        arguments:
            $deepseekApiKey: '%env(DEEPSEEK_API_KEY)%'




    # Register the PDF generator service
    App\Service\PdfGenerator:
        arguments:
            $pdf: '@knp_snappy.pdf'
            $twig: '@twig'
            $projectDir: '%kernel.project_dir%'