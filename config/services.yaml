parameters:
    openrouter.api_key: '%env(OPENROUTER_API_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\AiAssistantService:
        arguments:
            $openrouterApiKey: '%openrouter.api_key%'
